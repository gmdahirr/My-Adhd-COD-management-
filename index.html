function summary(){
let out='';
let sched=DATA.DAILY_SCHEDULE.map(d=>`<div style="padding:7px 0;border-bottom:1px solid #1A2A35"><div style="display:flex;justify-content:space-between"><b style="font-size:12px;color:#C8CAD4">${esc(d.slot)}</b><span class="small">${esc(d.time)}</span></div>${d.items.map(it=>`<div style="margin:3px 0 0 8px;font-size:12px;color:${it.color}"><b>${esc(it.name)}</b> ${esc(it.dose||'')}${it.flag?`<div style="font-size:10px;color:#D4A055">⚠ ${esc(it.flag)}</div>`:''}</div>`).join('')}</div>`).join('');
out+=card(st('Daily Medication Schedule — Updated Oct 28','#4A9EBF')+sched+`<div style="margin-top:8px;padding:6px 10px;background:#120E08;border:1px solid #3A2A10;border-radius:7px">${DATA.DAILY_NOT_LISTED.map(n=>`<div style="font-size:10px;color:#D4A055">• ${esc(n)}</div>`).join('')}<div style="font-size:10px;color:#9AA0B4;margin-top:4px">Totals: Faverin 150mg/day · Bupropion 300mg/day (if night dose is Faverin). He sleeps ~1am–7:30am plus ~2h after morning tablets — stay up after taking Vyvanse if possible.</div></div>`,`background:#0A1218;border:1px solid #1A3A4A`);
out+=`<div style="background:#1A0A0A;border:2px solid #E85D5D;border-radius:10px;padding:12px 14px;margin-bottom:12px"><div style="font-size:10px;color:#E85D5D;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px">★ Today — Oct 28 — Vyvanse Week 1 Review</div>${DATA.OCT28_CHECKLIST.map(c=>`<div style="display:flex;gap:10px;padding:4px 0;border-bottom:1px solid #2A1010"><b style="font-size:11px;color:#E85D5D;min-width:110px">${esc(c.item)}</b><span style="font-size:11px;color:#9AA0B4">${esc(c.target)}</span></div>`).join('')}</div>`;
out+=card(st('Vyvanse — Dosing Protocol','#E85D5D')+DATA.VYVANSE_PROTOCOL.map(v=>`<div class="pm ${v.active?'active':v.done?'done':''}"><div style="display:flex;justify-content:space-between"><span class="date" style="color:${v.active?'#E85D5D':'#6B7A99'}">${esc(v.date)}</span><span class="dose" style="color:${v.active?'#FF8080':'#E85D5D'}">${esc(v.dose)} ${v.active?'<span class="badge DECISION">NOW</span>':''}</span></div><div class="small">${esc(v.note)}</div></div>`).join('')+`<div style="margin-top:8px;padding:6px 10px;background:#120A08;border:1px solid #2A1A10;border-radius:7px;font-size:11px;color:#D4A055">⚠ 30mg + Bupropion 300mg XL = ~40–45mg equivalent. 40mg not sold in Pakistan — next step is 50mg. Equivalence figures are rough estimates.</div>`,`background:#0A0A1A;border:1px solid #2A1A3A`);
out+=card(st('Vyvanse vs Concerta — This Patient','#E85D5D')+`<div class="tablewrap"><table class="tbl"><thead><tr><th>Parameter</th><th style="color:#E85D5D">Vyvanse ✓</th><th style="color:#E8A838">Concerta</th></tr></thead><tbody>${DATA.VYV_VS_CON.map(r=>`<tr><td>${esc(r.param)}</td><td>${esc(r.vyvanse)}</td><td>${esc(r.concerta)}</td></tr>`).join('')}</tbody></table></div>`);
out+=card(st('OCD — 3 Confirmed Domains','#4A9EBF')+DATA.OCD_DOMAINS.map(d=>`<div style="display:flex;gap:10px;padding:8px 10px;background:${d.color}0A;border:1px solid ${d.color}28;border-radius:8px;margin-bottom:6px"><span>${d.icon}</span><div><b style="font-size:12px;color:${d.color}">${esc(d.title)}</b><div class="small" style="line-height:1.6">${esc(d.body)}</div></div></div>`).join(''));
let sc={confirmed:['#1A2A1A','#5B8A6F','#2A4A2A','#5B8A6F','CONFIRMED'],active:['#1A1500','#D4A055','#3A3000','#D4A055','ACTIVE'],'ruled-out':['#1A1A2A','#6B7A99','#2A2A3A','#3A3A5A','RULED OUT']};
out+=card(st('Diagnostic Summary')+DATA.DIAGNOSES.map(d=>{let c=sc[d.status];return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span class="dot" style="background:${c[3]}"></span><div style="flex:1"><b style="font-size:12px;color:#C8CAD4">${esc(d.label)}</b>${d.note?`<span class="small"> — ${esc(d.note)}</span>`:''}</div><span style="font-size:9px;background:${c[0]};color:${c[1]};border:1px solid ${c[2]};border-radius:4px;padding:1px 6px;font-weight:700">${c[4]}</span></div>`}).join(''));
out+=card(st('Sertraline Taper — Complete ✓','#5B8A6F')+DATA.SERTRALINE_TAPER.map(s=>`<div style="display:flex;align-items:center;gap:10px;padding:4px 8px;background:${s.ceased?'#0A0A0A':'#0A150A'};border:1px solid ${s.ceased?'#2A1010':'#1A3A1A'};border-radius:6px;margin-bottom:4px"><span>${s.ceased?'✕':'✓'}</span><span class="small" style="min-width:105px">${esc(s.dates)}</span><b style="font-size:12px;color:${s.ceased?'#E07070':'#5B8A6F'}">${esc(s.dose)}</b></div>`).join(''));
out+=card(st('Faverin IR — Dosing Schedule','#4A9EBF')+DATA.FAVERIN_SCHEDULE.map(f=>`<div class="pm ${f.active?'active':f.done?'done':''}"><div style="display:flex;justify-content:space-between"><span class="date">${esc(f.date)}</span><b style="font-size:12px;color:${f.active?'#7AC8E8':'#4A9EBF'}">${esc(f.dose)} ${f.active?'<span class="badge DECISION">NOW</span>':''}</b></div><div class="small">${esc(f.detail)}</div></div>`).join(''),`background:#0A1520;border:1px solid #1A3A5A`);
out+=card(st('Sleep Protocol — Oct 28 Status','#7A6FBF')+DATA.SLEEP_PROTOCOL.map(s=>`<div style="display:flex;gap:8px;padding:7px 8px;background:#12102A;border:1px solid #2A2A5A;border-radius:7px;margin-bottom:5px"><div style="width:18px;height:18px;border-radius:50%;background:${s.color}25;border:1px solid ${s.color}50;display:flex;align-items:center;justify-content:center;flex:none">${s.line}</div><div style="flex:1"><div style="display:flex;justify-content:space-between"><b style="font-size:12px;color:#C8CAD4">${esc(s.name)}</b><span style="font-size:8px;color:${s.color};font-weight:700">${esc(s.status)}</span></div><div class="small">${esc(s.note)}</div></div></div>`).join('')+`<div class="small">⚠ Phone out of bedroom. Checking time · phone · mental review on waking = OCD compulsions.</div>`,`background:#0E0A1A;border:1px solid #2A1A3A`);
out+=card(st('ATX + Vyvanse Together — Always Wrong','#E07070')+DATA.ATX_VYV_REASONS.map(r=>`<div style="display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #1E0808"><span style="color:#E07070">✗</span><span class="small">${esc(r)}</span></div>`).join(''),`background:#120808;border:1px solid #3A1010`);
out+=card(st('OCD Medications','#4A9EBF')+DATA.OCD_DRUGS.map(o=>`<div style="display:flex;gap:10px;padding:7px 8px;background:${o.color}08;border:1px solid ${o.color}25;border-radius:8px;margin-bottom:5px"><span class="dot" style="background:${o.color};margin-top:5px"></span><div style="flex:1"><div style="display:flex;justify-content:space-between"><b style="font-size:12px;color:${o.color}">${esc(o.drug)}</b><span style="font-size:9px;color:${o.color};font-weight:800">${esc(o.verdict)}</span></div><div class="small">${esc(o.note)}</div></div></div>`).join(''));
out+=card(st('CYP2D6 — Bupropion 300mg XL Strong Inhibitor','#D4A055')+DATA.CYP2D6_TABLE.map(c=>`<div style="display:flex;gap:10px;padding:6px 0;border-bottom:1px solid #1E1808"><b style="font-size:11px;color:${c.ok?'#7AAA8A':'#D4A055'};min-width:120px">${esc(c.drug)}</b><span class="small" style="flex:1">${esc(c.effect)}</span><b style="font-size:10px;color:${c.ok?'#5B8A6F':'#8B6A30'}">${esc(c.action)}</b></div>`).join(''),`background:#120E08;border:1px solid #3A2A10`);
out+=card(st('Medications — Failed / Stopped','#E07070')+DATA.FAILED_DRUGS.map(f=>`<div style="display:flex;gap:10px;padding:4px 0;border-bottom:1px solid #1E2130"><b style="font-size:11px;color:#E07070;min-width:130px;text-decoration:line-through">${esc(f.drug)}</b><span class="small">${esc(f.reason)}</span></div>`).join(''));
return out}
function phases(){return `<div class="section-list">${DATA.PHASES.map(p=>{let done=!!state.checked[p.id],open=!!state.expanded[p.id];return `<div class="phase ${done?'done':''} ${p.active&&!done?'active':''}">${p.active&&!done?'<div class="phasebar">▶ ACTIVE PHASE — Oct 28 Review</div>':''}<div class="phasehead" onclick="toggleOpen('${p.id}')"><div class="check" onclick="toggleDone(event,'${p.id}')">${done?'✓':''}</div><div style="flex:1"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="small">${esc(p.dates)}</span>${badge(p.badge)}</div><div style="font-size:13px;font-weight:600;color:${done?'#7AAA8A':p.active?'#90C850':'#C8CAD4'}">${esc(p.label)}</div></div><span class="muted">${open?'▲':'▼'}</span></div><div style="display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 12px 47px">${p.meds.map(med).join('')}</div>${open?`<div class="phasebody"><div style="padding-top:12px;font-size:12px;color:#9AA0B4;line-height:1.75;white-space:pre-line">${esc(p.notes)}</div>${p.alert?`<div style="margin-top:10px;background:#1A0D00;border:1px solid #4A3000;border-radius:8px;padding:9px 12px;font-size:11px;color:#D4A055">⚠ ${esc(p.alert)}</div>`:''}</div>`:''}</div>`}).join('')}</div>`}
function taper(){return `<div class="section-list">${DATA.TAPER_SCHEDULE.map(d=>`<section class="card" style="padding:0;border-color:${d.color}30;overflow:hidden"><div style="background:${d.color}18;border-bottom:1px solid ${d.color}30;padding:10px 16px"><b style="font-size:13px;color:${d.color}">● ${esc(d.drug)}</b></div>${d.steps.map(s=>`<div style="display:flex;gap:10px;padding:9px 16px;border-bottom:1px solid #1E2130;background:${s.active?'#12181A':s.done?'#0D150D':'transparent'}"><span class="small" style="min-width:110px">${esc(s.dates)}</span><div><b style="font-size:12px;color:${s.ceased?'#E07070':s.active?'#90C850':s.done?'#5B8A6F':d.color}">${esc(s.dose)}</b>${s.note?`<span class="small"> — ${esc(s.note)}</span>`:''}${s.active?'<span class="badge NEW" style="margin-left:8px">NOW</span>':''}</div></div>`).join('')}</section>`).join('')}</div>`}
function alerts(){return `<div class="section-list">${DATA.ALERTS.map(a=>`<div class="alert" style="--c:${a.color};--c30:${a.color}30"><h3>${esc(a.label)}</h3><p>${esc(a.text)}</p></div>`).join('')}</div>`}
function decisions(){return `<div class="card" style="padding:0;overflow:hidden">${DATA.DECISIONS.map(d=>`<div class="decision" style="background:${d.date.includes('★')?'#1A0A0A':'transparent'}"><b class="date" style="color:${d.color}">${esc(d.date)}</b><div class="text" style="color:${d.date.includes('★')?'#E8CAC0':'#9AA0B4'}">${esc(d.text)}</div></div>`).join('')}</div>`}
function render(){let done=Object.values(state.checked).filter(Boolean).length;let pct=done/DATA.PHASES.length*100;document.getElementById('app').innerHTML=`<div class="header"><div><div class="muted" style="font-size:10px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:4px">Neuropsychiatry · Active Case</div><div class="title">41M · ADHD + OCD + GAD + Grief</div><div class="sub">MDD · Bipolar · Autism — ruled out · Jun 2025 – Jan 2026</div></div><div class="count"><b>${done}</b><span>of ${DATA.PHASES.length} phases</span></div></div><div class="progress"><i style="width:${pct}%"></i></div><div class="vitals">${[[DATA.VITALS_AUG29,'Aug 29 Vitals','#1A3A5A','#0D1520'],[DATA.VITALS_OCT14,'Oct 14 Update','#1A4A20','#0D1A10'],[DATA.VITALS_OCT28,'Oct 28 — Today','#3A1A1A','#1A0A0A']].map(([items,title,bg,bg2])=>`<div class="vital" style="background:${bg2};border:1px solid ${bg}"><h3>${title}</h3>${items.map(v=>`<div class="vrow"><span class="muted">${esc(v.label)}</span><span class="val" style="color:${v.ok?'#7AAA8A':'#D4A055'}">${v.ok?'✓':'⚠'} ${esc(v.value)}</span></div>`).join('')}</div>`).join('')}</div><div class="tabs">${[['summary','📋 Summary'],['phases',`🔬 Phases (${DATA.PHASES.length})`],['taper','💊 Taper'],['alerts',`⚠ Alerts (${DATA.ALERTS.length})`],['decisions',`🎯 Decisions (${DATA.DECISIONS.length})`]].map(([t,l])=>`<button class="tab ${state.tab===t?'active':''}" onclick="setTab('${t}')">${l}</button>`).join('')}</div><div>${state.tab==='summary'?summary():state.tab==='phases'?phases():state.tab==='taper'?taper():state.tab==='alerts'?alerts():decisions()}</div><div class="legend">${Object.values(DATA.DRUGS).map(d=>`<span><i class="dot" style="background:${d.color}"></i>${esc(d.name)}</span>`).join('')}</div><div class="footer">Summary · Phases · Taper · Alerts · Decisions · Offline HTML version · Updated Oct 28, 2025 (source preserved)</div>`}
function save(){localStorage.setItem(storage,JSON.stringify(state.checked))}
function setTab(t){state.tab=t;render()}
function toggleOpen(id){state.expanded[id]=!state.expanded[id];render()}
function toggleDone(e,id){e.stopPropagation();state.checked[id]=!state.checked[id];save();render()}
render();
</script></body></html>
